<div class="barra-filtros">
  <div class="contenedor">
    <form class="filtros" id="filtros" aria-label="Filtrar propiedades">
      <fieldset>
        <legend>Operación</legend>
        <div class="segmentos">
          <label><input type="radio" name="operacion" value="" checked>Todas</label>
          <label><input type="radio" name="operacion" value="venta">Venta</label>
          <label><input type="radio" name="operacion" value="renta">Renta</label>
        </div>
      </fieldset>
      <label>Tipo
        <select name="tipo">
          <option value="">Todos</option>
          <option>Casa</option><option>Departamento</option><option>Terreno</option><option>Local</option>
        </select>
      </label>
      <label>Recámaras
        <select name="recamaras">
          <option value="">Cualquiera</option>
          <option value="1">1 o más</option><option value="2">2 o más</option><option value="3">3 o más</option><option value="4">4 o más</option>
        </select>
      </label>
      <label>Precio
        <select name="precio"></select>
      </label>
      <label>Ordenar
        <select name="orden" data-defecto="recientes">
          <option value="recientes">Más recientes</option>
          <option value="precio-asc">Menor precio</option>
          <option value="precio-desc">Mayor precio</option>
          <option value="tamano">Más grandes</option>
        </select>
      </label>
      <button class="limpiar" type="reset">Quitar filtros</button>

<div class="vista" id="vista">
  <section class="listado" aria-label="Propiedades en la zona del mapa">
    <div class="encabezado-lista">
      <p class="conteo" id="conteo" aria-live="polite"></p>
      <label class="solo-zona"><input type="checkbox" id="solo-zona" checked>Solo lo que se ve en el mapa</label>
    </div>
    <div class="rejilla" id="rejilla"></div>
    <p class="aviso-demo">Catálogo de demostración: las propiedades son de ejemplo.</p>
  </section>
  <div id="mapa" role="region" aria-label="Mapa de propiedades"></div>
  <button class="boton cambiar-vista" id="cambiar-vista" type="button" aria-controls="vista">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 0v14m6-12v14"/></svg><span>Ver mapa</span>
  </button>
</div>

<script src="recursos/leaflet/leaflet.js"></script>
<script src="recursos/propiedades-datos.js"></script>
<script src="recursos/propiedades.js"></script>
<script>
(function(){
  const P = window.Propiedades;
  const form = document.getElementById('filtros');
  const rejilla = document.getElementById('rejilla');
  const conteo = document.getElementById('conteo');
  const soloZona = document.getElementById('solo-zona');
  const vista = document.getElementById('vista');

  // Mapa centrado en Monterrey. Mapa base gratuito de OpenStreetMap (estilo CARTO).
  const mapa = L.map('mapa', {zoomControl:false, scrollWheelZoom:true}).setView([25.68, -100.32], 11);
  L.control.zoom({position:'topright'}).addTo(mapa);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 19, subdomains: 'abcd',
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }).addTo(mapa);

  // Una etiqueta con el precio por propiedad
  const marcas = new Map();
  P.lista.forEach(p => {
    const icono = L.divIcon({className:'pin ' + p.operacion, html:`<span>${P.escapar(P.precioCorto(p))}</span>`, iconSize:[0,0]});
    const m = L.marker([p.lat, p.lng], {icon:icono, title:P.titulo(p) + ', ' + P.precioLargo(p), riseOnHover:true});
    m.bindPopup(`<button class="globo" type="button" data-abrir="${P.escapar(p.clave)}">
        <div class="tarjeta-img">${P.imagen(p)}</div>
        <div class="texto"><b>${P.escapar(P.titulo(p))}</b><small>${P.escapar(P.resumen(p))}</small><strong>${P.escapar(P.precioLargo(p))}</strong></div>
      </button>`, {offset:[0,-30], closeButton:true, autoPanPadding:[30,30]});
    m.on('mouseover', () => resaltar(p.clave, true));
    m.on('mouseout', () => resaltar(p.clave, false));
    marcas.set(p.clave, m);
  });

  function resaltar(clave, si){
    const m = marcas.get(clave);
    if (m && m._icon){ m._icon.classList.toggle('activo', si); m.setZIndexOffset(si ? 1000 : 0); }
    const t = rejilla.querySelector(`[data-clave="${CSS.escape(clave)}"]`);
    if (t) t.classList.toggle('activa', si);
  }

  let filtradas = [];
  function aplicarFiltros(ajustar){
    filtradas = P.filtrar(form);
    const visibles = new Set(filtradas.map(p => p.clave));
    marcas.forEach((m, clave) => {
      if (visibles.has(clave)) { if (!mapa.hasLayer(m)) m.addTo(mapa); }
      else mapa.removeLayer(m);
    });
    if (ajustar && filtradas.length){
      mapa.fitBounds(L.latLngBounds(filtradas.map(p => [p.lat, p.lng])), {padding:[50,50], maxZoom:14});
    }
    pintarLista();
  }

  function pintarLista(){
    const limites = mapa.getBounds();
    const r = soloZona.checked ? filtradas.filter(p => limites.contains([p.lat, p.lng])) : filtradas;
    const fuera = filtradas.length - r.length;
    conteo.innerHTML = (r.length === 1 ? '<b>1</b> propiedad' : `<b>${r.length}</b> propiedades`) +
      (soloZona.checked ? ' en esta zona' : '') + (fuera ? ` · ${fuera} fuera del mapa` : '');
    rejilla.innerHTML = r.length ? r.map(P.tarjeta).join('')
      : `<p class="vacio">${filtradas.length ? 'No hay propiedades en esta parte del mapa. Aleje el mapa o muévalo.' : 'No hay propiedades con esos filtros. Pruebe quitando alguno.'}</p>`;
  }

  function centrar(clave){
    const m = marcas.get(clave);
    if (!m) return;
    vista.classList.add('ver-mapa'); actualizarBoton();
    mapa.invalidateSize();
    if (!mapa.hasLayer(m)) m.addTo(mapa);
    mapa.flyTo(m.getLatLng(), Math.max(mapa.getZoom(), 15), {duration:.6});
    mapa.once('moveend', () => m.openPopup());
  }

  // Tarjetas: al pasar el cursor se resalta su precio en el mapa; al tocarlas se abre la ficha
  rejilla.addEventListener('mouseover', e => { const t = e.target.closest('.tarjeta'); if (t) resaltar(t.dataset.clave, true); });
  rejilla.addEventListener('mouseout', e => { const t = e.target.closest('.tarjeta'); if (t && !t.contains(e.relatedTarget)) resaltar(t.dataset.clave, false); });
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-abrir]');
    if (a) { P.abrirFicha(a.dataset.abrir, {enMapa:true}); return; }
    const c = e.target.closest('[data-centrar]');
    if (c) centrar(c.dataset.centrar);
  });

  P.leerFiltros(form);
  form.addEventListener('change', e => {
    if (e.target.name === 'operacion') P.opcionesPrecio(form);
    P.guardarFiltros(form); aplicarFiltros(e.target.name !== 'orden');
  });
  form.addEventListener('reset', () => setTimeout(() => { P.opcionesPrecio(form); P.guardarFiltros(form); aplicarFiltros(true); }));
  soloZona.addEventListener('change', pintarLista);
  mapa.on('moveend', pintarLista);

  // Celular: un botón cambia entre la lista y el mapa
  const boton = document.getElementById('cambiar-vista');
  function actualizarBoton(){
    const enMapa = vista.classList.contains('ver-mapa');
    boton.querySelector('span').textContent = enMapa ? 'Ver lista' : 'Ver mapa';
  }
  boton.addEventListener('click', () => {
    vista.classList.toggle('ver-mapa'); actualizarBoton();
    mapa.invalidateSize();
  });

  P.guardarFiltros(form);
  aplicarFiltros(true);
  // Llegando desde el catálogo con "Ver en el mapa" (mapa.html#CF-101)
  if (location.hash) centrar(decodeURIComponent(location.hash.slice(1)));
})();
</script>
